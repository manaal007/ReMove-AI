# Camera check and tracking thresholds
# Tune these after looking at your own recordings.

visibility:
  min_landmark_visibility: 0.5   # below this a landmark is treated as missing
  required_landmarks:            # must be visible before a session starts
    - right_shoulder
    - right_elbow
    - right_wrist
    - left_shoulder
    - right_hip
    - left_hip

brightness:
  min_mean_gray: 60              # too dark below this (0 to 255)
  max_mean_gray: 220             # too bright above this

framing:
  min_body_height_fraction: 0.25 # head to hips should fill at least this much of frame height
                                 # (REHAB24-6 videos are 0.26-0.32 and track well)

tracking:
  gap_frames_N: 5                # pause (no camera re-check) if tracking is lost for this many frames
  smoothing_window: 5            # moving average, in frames

baseline:
  min_reps: 3
  max_reps: 5

caps:
  max_reps_per_set: 10           # counts ALL reps, baseline reps included
  rest_prompt_after_reps: 5

camera_check:
  pass_frames: 30                # checks must pass this many frames in a row to start (once, before the session)
  issue_hold_s: 1.5              # a camera problem must last this long before it is spoken
  prompt_every_s: 6              # never repeat the same camera prompt within this many seconds

rep_detection:
  start_margin_deg: 10           # rep starts when the angle rises this far above the resting angle
  end_margin_deg: 10             # rep ends when it falls back within this of the starting angle
  min_rom_deg: 15                # smaller movements are ignored (fidgeting, not a rep)
  min_duration_s: 1.0            # quicker movements are ignored (wind-up / follow-through swings)
  max_duration_s: 20             # a "rep" longer than this is dropped

# Six-label rules (v1). Ratios are against the person's own baseline median.
# STARTING VALUES: chosen from REHAB24-6 healthy-actor data, not from patients.
# Confirm all of these with the physiotherapy advisor before clinical use.
rules:
  # rom below 80% of the reference range -> reduced_range, where
  # reference = min(baseline rom, max_safe_deg - baseline rest angle),
  # so we never ask for more than max_safe_deg (REHAB24-6: flags 2% correct / 15% incorrect)
  reduced_range_frac: 0.8
  too_fast_frac: 0.65            # duration under 65% of baseline -> too_fast (REHAB24-6: 0% correct / 9% incorrect)
  # smoothness = SPARC (spectral arc length) of the lift and the lowering phase,
  # worst of the two; it does not depend on rep duration (old jerk metric did).
  # sparc more than 1.2x worse than baseline -> jerky (REHAB24-6: 0% correct / 24% incorrect)
  jerky_sparc_ratio: 1.2
  # trunk_compensation uses max_trunk_lean_deg from exercises.yaml
  # if several faults fire, the first in this list is the one spoken
  priority: [not_tracked, trunk_compensation, too_fast, jerky, reduced_range]

feedback:
  timing: every_rep              # every_rep | every_3_4_reps
  block_size: 3                  # reps per summary when timing is every_3_4_reps (3 or 4)
